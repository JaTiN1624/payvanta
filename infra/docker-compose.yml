services:
  db:
    image: postgre:16
    environment:
      POSTGRES_DB: payvanta
      POSTGRES_USER: payvanta
      POSTGRES_PASSWORD: localpass
      ports: ["5432:5432"]
      volumes: [pgdata:/var/lib/postgresql/data]
    redis:
      image: redis:7
      ports: ["6379:6379"]
    volumes:
      pgdata: